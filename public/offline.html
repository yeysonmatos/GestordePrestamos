<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sin conexión | Gestor de Prestamos</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
        background: #fbfaf6;
        color: #121b28;
      }
      .card {
        max-width: 380px;
        margin: 24px;
        padding: 32px 28px;
        background: #fff;
        border: 1px solid #d8dfe6;
        border-radius: 20px;
        text-align: center;
      }
      img { width: 72px; height: 72px; margin-bottom: 16px; }
      h1 { font-size: 20px; margin: 0 0 8px; }
      p { font-size: 14px; color: #636d7a; margin: 0 0 20px; }
      button {
        background: #1f344e;
        color: #fff;
        border: 0;
        border-radius: 12px;
        padding: 12px 24px;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <img src="/gp-icon.png" alt="Gestor de Prestamos" />
      <h1>Sin conexión</h1>
      <p>No estás conectado a internet. Conéctate y vuelve a intentar para ver tus datos.</p>
      <button onclick="window.location.reload()">Reintentar</button>
    </div>
  </body>
</html>
